name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(TZ='America/Los_Angeles' date +"%b %d %H:%M %Z")
          VERSION="${SHORT_SHA} ${TIMESTAMP}"

          echo "Build version: ${VERSION}"

          sed -i "s|__BUILD_VERSION__|${VERSION}|g" index.html
          sed -i "s|__BUILD_HASH__|${SHORT_SHA}|g" sw.js

          # Cache-bust our own JS and CSS so browsers fetch fresh copies right after
          # each deploy, instead of reusing saved ones for up to 10 minutes.
          sed -i -E "s#(src=\"js/[^\"?]+\.js)\"#\1?v=${SHORT_SHA}\"#g" index.html
          sed -i -E "s#href=\"styles\.css(\?v=[^\"]*)?\"#href=\"styles.css?v=${SHORT_SHA}\"#g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
